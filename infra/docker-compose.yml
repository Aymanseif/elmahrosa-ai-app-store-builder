version: \"3.8\"\n\nservices:\n  postgres:\n    image: postgres:15\n    environment:\n      POSTGRES_DB: elmahrosa\n      POSTGRES_USER: elmahrosa\n      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elmasafe123}\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n    ports:\n      - \"5432:5432\"\n    healthcheck:\n      test: [\"CMD\", \"pg_isready\", \"-U\", \"elmahrosa\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n\n  redis:\n    image: redis:7-alpine\n    ports:\n      - \"6379:6379\"\n    volumes:\n      - redis_data:/data\n    command: redis-server --appendonly yes\n    healthcheck:\n      test: [\"CMD\", \"redis-cli\", \"ping\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n\n  api-core:\n    build: ../services/api-core\n    ports:\n      - \"3001:3000\"\n    environment:\n      - DATABASE_URL=postgresql://elmahrosa:${POSTGRES_PASSWORD:-elmasafe123}@postgres:5432/elmahrosa\n      - REDIS_URL=redis://redis:6379\n      - PORT=3000\n    depends_on:\n      postgres:\n        condition: service_healthy\n      redis:\n        condition: service_healthy\n\n  ai-generator:\n    build: ../services/ai-generator\n    ports:\n      - \"8000:8000\"\n    environment:\n      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}\n    depends_on:\n      - api-core\n\n  build-engine:\n    build: ../services/build-engine\n    ports:\n      - \"8080:8080\"\n    environment:\n      - KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}\n      - KEY_PASSWORD=${KEY_PASSWORD}\n    depends_on:\n      - api-core\n\nvolumes:\n  postgres_data:\n  redis_data:
