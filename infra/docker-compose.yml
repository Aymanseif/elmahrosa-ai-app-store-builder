version: "3.8"

services:
  postgres:
    image: postgres:15
    # Milestone 1.4: no default password. POSTGRES_PASSWORD must be provided
    # via .env — the postgres entrypoint fails fast with an explicit error
    # when it is unset, rather than starting with a known credential.
    environment:
      POSTGRES_DB: elmahrosa
      POSTGRES_USER: elmahrosa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Milestone 1.4: data services bind to loopback only when published.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "elmahrosa"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-core:
    build: ../services/api-core
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://elmahrosa:${POSTGRES_PASSWORD}@postgres:5432/elmahrosa
      - REDIS_URL=redis://redis:6379
      - PORT=3000
      - CLERK_ISSUER_URL=${CLERK_ISSUER_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Milestone 1.5: /health wired as the compose healthcheck.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  ai-generator:
    build: ../services/ai-generator
    # Milestone 1.3: no host port publication. The service is reached
    # service-to-service (api-core -> ai-generator) and must not be exposed
    # to the host network.
    expose:
      - "8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SERVICE_TOKEN=${SERVICE_TOKEN}
    depends_on:
      - api-core
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 15s
      timeout: 5s
      retries: 3

# NOTE: services/build-engine is intentionally NOT defined here. The app
# scaffold cannot compile (see the remediation order, finding C-5) and is
# quarantined until the Phase 3 rebuild lands. Do not re-add it to compose
# until `./gradlew assembleDebug` passes inside its image.

volumes:
  postgres_data:
  redis_data:
