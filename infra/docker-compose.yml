version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: elmahrosa
      POSTGRES_USER: elmahrosa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elmasafe123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "elmahrosa"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-core:
    build: ../services/api-core
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://elmahrosa:${POSTGRES_PASSWORD:-elmasafe123}@postgres:5432/elmahrosa
      - REDIS_URL=redis://redis:6379
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-generator:
    build: ../services/ai-generator
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - api-core

  build-engine:
    build: ../services/build-engine
    ports:
      - "8080:8080"
    environment:
      - KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
      - KEY_PASSWORD=${KEY_PASSWORD}
    depends_on:
      - api-core

volumes:
  postgres_data:
  redis_data:
