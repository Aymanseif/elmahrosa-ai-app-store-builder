name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-core, ai-generator, build-engine, web-app, sharing-hub]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
          cache: pip
      
      - name: Install dependencies
        run: |
          pnpm install
          # Install Python dependencies for ai-generator
          cd services/ai-generator && pip install -r requirements.txt || true
      
      - name: Lint code
        run: |
          # Run ESLint for Node.js services
          pnpm run lint || true
          # Run flake8 for Python services
          cd services/ai-generator && flake8 . || true
      
      - name: Run tests
        run: |
          # Run tests for each service
          pnpm test --filter ${ {matrix.service} } || true
          # For Python service
          if [ "${ {matrix.service} }" = "ai-generator" ]; then
            cd services/ai-generator && python -m pytest || true
          fi
      
      - name: Build Docker images
        if: github.ref == refs/heads/main
        run: |
          # Build and push Docker images to registry
          echo "Building Docker images for production"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Snyk security scan
        uses: snyk/actions@v2
        continue-on-error: true
        with:
          command: monitor
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        with:
          fail-on-severity: moderate
