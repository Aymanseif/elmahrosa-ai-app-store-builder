name: CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build, tag, and push Docker images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: elmahrosa
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build and push all services
          for service in api-core ai-generator build-engine web-app sharing-hub; do
            docker build -t $ECR_REGISTRY/$ECR_REPOSITORY-$service:$IMAGE_TAG ./services/$service
            docker push $ECR_REGISTRY/$ECR_REPOSITORY-$service:$IMAGE_TAG
          done
      
      - name: Deploy to ECS
        run: |
          # Update ECS services with new image tags
          aws ecs update-service --cluster elmahrosa-cluster --service api-core-service --image ${{ steps.login-ecr.outputs.registry }}/elmahrosa-api-core:${{ github.sha }}
          aws ecs update-service --cluster elmahrosa-cluster --service ai-generator-service --image ${{ steps.login-ecr.outputs.registry }}/elmahrosa-ai-generator:${{ github.sha }}
          aws ecs update-service --cluster elmahrosa-cluster --service build-engine-service --image ${{ steps.login-ecr.outputs.registry }}/elmahrosa-build-engine:${{ github.sha }}
          # For frontend services, we might use a different approach (like Amplify or S3+CloudFront)
          echo "Frontend deployment would happen here"

