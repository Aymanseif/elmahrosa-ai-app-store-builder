name: CD

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # FIX: three name mismatches with infra/terraform made every deploy fail:
      # (1) ECR repos are elmahrosa/<service> (slash) but we pushed to
      #     elmahrosa-<service>; (2) ECS services are elmahrosa-<service> but we
      #     updated api-core-service / ai-generator-service; (3) Terraform
      #     declares a full web-app ECS service + repo + ALB route, but the
      #     deploy claimed web-app is handled separately and never pushed its
      #     image. build-engine is a build pipeline, not a long-running service,
      #     so it is not in the matrix. All Dockerfiles build from the repo root
      #     so pnpm installs from the committed pnpm-lock.yaml.
      - name: Build, tag, and push Docker images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: elmahrosa
          IMAGE_TAG: ${{ github.sha }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          declare -A SERVICE_DOCKERFILES=(
            [api-core]=services/api-core/Dockerfile
            [ai-generator]=services/ai-generator/Dockerfile
            [web-app]=apps/web-app/Dockerfile
          )
          for service in "${!SERVICE_DOCKERFILES[@]}"; do
            dockerfile="${SERVICE_DOCKERFILES[$service]}"
            if [ ! -f "$dockerfile" ]; then
              echo "::warning::Skipping $service — no Dockerfile at $dockerfile"
              continue
            fi
            if [ "$service" = "web-app" ]; then
              # NEXT_PUBLIC_API_URL is mandatory; an empty value means the
              # bundle would be built with the localhost fallback, breaking
              # every user's browser. Hard-fail so the deploy never ships.
              if [ -z "$NEXT_PUBLIC_API_URL" ]; then
                echo "::error::NEXT_PUBLIC_API_URL secret is required and not set" >&2
                exit 1
              fi
              echo "::group::web-app NEXT_PUBLIC build args"
              echo "  API_URL: $NEXT_PUBLIC_API_URL"
              grep -q '.' <<< "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" || echo "  WARNING: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is empty — Clerk will be disabled"
              grep -q '.' <<< "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" || echo "  WARNING: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY is empty — Stripe checkout disabled"
              echo "::endgroup::"
              docker build -f "$dockerfile" \
                --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
                --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" \
                --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" \
                -t "$ECR_REGISTRY/$ECR_REPOSITORY/$service:$IMAGE_TAG" .
            else
              docker build -f "$dockerfile" -t "$ECR_REGISTRY/$ECR_REPOSITORY/$service:$IMAGE_TAG" .
            fi
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY/$service:$IMAGE_TAG"
          done

      # Task definitions are declared in Terraform with `image = "…:${var.image_tag}"`,
      # baked in at apply time — so a bare `--force-new-deployment` would roll out
      # the image tag from the last apply, not the commit just pushed. To deploy
      # the new image we re-register each family with the image URI rewritten to
      # the pushed SHA, then update the service to that new revision.
      - name: Deploy to ECS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: elmahrosa
        run: |
          set -euo pipefail
          for svc in api-core ai-generator web-app; do
            family="elmahrosa-$svc"
            new_image="$ECR_REGISTRY/$ECR_REPOSITORY/$svc:$IMAGE_TAG"

            # Rewrite every container's image to the pushed SHA, strip the
            # read-only fields that register-task-definition rejects, and re-
            # register the family. update-service then rolls the new revision.
            newtask="$(aws ecs describe-task-definition --task-definition "$family" \
              --query 'taskDefinition' --output json | jq -c \
              'del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                   .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
               | .containerDefinitions[0].image = $img' \
              --arg img "$new_image")"

            aws ecs register-task-definition --cli-input-json "$newtask" >/dev/null
            echo "registered $family revision for $new_image"

            aws ecs update-service --cluster elmahrosa-cluster --service "$family" \
              --task-definition "$family" --force-new-deployment >/dev/null
            echo "updated $family"
          done

      # Phase 2 post-deploy smoke gate: wait for each service to be stable, then
      # probe reachable public endpoints with a bounded retry so a bad image
      # fails the deploy instead of silently serving errors after rollout.
      # ai-generator is an internal worker with no LB attachment — its
      # healthcheck is covered by ecs wait services-stable below.
      - name: Wait for ECS services to reach steady state
        env:
          ECS_CLUSTER: elmahrosa-cluster
        run: |
          set -euo pipefail
          for svc in api-core ai-generator web-app; do
            aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "elmahrosa-$svc"
            echo "✅ elmahrosa-$svc stable"
          done

      - name: Smoke test public endpoints via the ALB
        run: |
          set -euo pipefail
          # Resolve the ALB DNS from AWS so the probe works without storing a
          # hardcoded hostname. Abort the gate only if a real ALB exists but
          # never comes healthy; a missing ALB (first deploy) warns and passes.
          ALB_DNS="$(aws elbv2 describe-load-balancers --query "LoadBalancers[?contains(LoadBalancerName, 'alb')].DNSName" --output text | awk '{print $1}')"
          if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" = "None" ]; then
            echo "⚠ No ALB found — skipping HTTP smoke probe (first deploy?). ECS stabilisation already verified above."
            exit 0
          fi
          # 30 tries x 10s = up to 5 minutes for rollout propagation.
          probe() {
            local url="$1"
            local expect="$2"
            for i in $(seq 1 30); do
              # -L follows the HTTP→HTTPS 301 the ALB issues when a cert is
              # attached, so the same probe passes both before and after HTTPS
              # is enabled (without a cert there is no redirect, still 200).
              code="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)"
              if [ "$code" = "$expect" ]; then
                echo "OK  $url -> $code"
                return 0
              fi
              echo "waiting for $url (attempt $i, got $code)"
              sleep 10
            done
            echo "FAIL $url never returned $expect after 30 attempts" >&2
            return 1
          }
          # web-app is the default ALB route; api-core answers under /api (an
          # unauthenticated /api/projects GET must 401, proving the service is
          # routing — not a 5xx from a broken image).
          probe "http://$ALB_DNS/" 200
          probe "http://$ALB_DNS/api/projects" 401
