name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

# FIX: almost every step below previously had `continue-on-error: true` or a
# trailing `|| true`, which means CI reported green regardless of whether
# lint/tests/audit actually passed. That defeats the purpose of having CI at
# all. This version lets failures fail the job. If some checks genuinely
# aren't ready yet (e.g. no tests written for a service), scope the
# exception to that specific step with a comment explaining why, rather than
# blanket-suppressing everything.

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web-app, api-core, sharing-hub]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --filter=${{ matrix.service }}

      - name: Run ESLint
        run: pnpm run lint --filter=${{ matrix.service }}

      - name: Run Prettier
        run: pnpm run format:check --filter=${{ matrix.service }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-core, web-app, sharing-hub, ai-generator]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          set -e
          pnpm install
          if [ "${{ matrix.service }}" = "ai-generator" ]; then
            cd services/ai-generator && pip install -r requirements.txt
          fi

      - name: Run tests
        run: |
          set -e
          if [ "${{ matrix.service }}" = "ai-generator" ]; then
            cd services/ai-generator && python -m pytest
          else
            pnpm test --filter=${{ matrix.service }}
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk security scan
        uses: snyk/actions@v2
        with:
          command: test
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run npm audit
        if: always()
        run: |
          set -e
          for dir in apps/* services/* packages/*; do
            if [ -f "$dir/package.json" ]; then
              echo "Checking $dir"
              (cd "$dir" && npm audit --audit-level=high)
            fi
          done

  dependabot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        with:
          fail-on-severity: moderate
          allow-ghas-advisories-in-pr: true
