name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Linting job
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web-app, api-core, sharing-hub]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --filter=${ {matrix.service} }
      
      - name: Run ESLint
        run: pnpm run lint --filter=${ {matrix.service} } || true
        continue-on-error: true  # Allow failures for now as we implement
      
      - name: Run Prettier
        run: pnpm run format:check --filter=${ {matrix.service} } || true
        continue-on-error: true

  # Testing job
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-core, web-app, sharing-hub, ai-generator]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pnpm install
          # Install Python dependencies for ai-generator
          if [ "${ {matrix.service} }" = "ai-generator" ]; then
            cd services/ai-generator && pip install -r requirements.txt || true
          fi
      
      - name: Run tests
        run: |
          if [ "${ {matrix.service} }" = "ai-generator" ]; then
            # Run Python tests
            cd services/ai-generator && python -m pytest || true
          else
            # Run JS/TS tests
            pnpm test --filter=${ {matrix.service} } || true
          fi
        continue-on-error: true

  # Security scanning job
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Snyk security scan
        uses: snyk/actions@v2
        continue-on-error: true
        with:
          command: test
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      
      - name: Run npm audit
        if: always()
        run: |
          # Run npm audit for JS/TS services
          for dir in apps/* services/* packages/*; do
            if [ -f "$dir/package.json" ]; then
              echo "Checking $dir"
              cd "$dir" && npm audit --audit-level=high || true
            fi
          done
        continue-on-error: true

  # Dependency check job
  dependabot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        with:
          fail-on-severity: moderate
          allow-ghas-advisories-in-pr: true
