name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

# FIX: almost every step below previously had `continue-on-error: true` or a
# trailing `|| true`, which means CI reported green regardless of whether
# lint/tests/audit actually passed. That defeats the purpose of having CI at
# all. This version lets failures fail the job. If some checks genuinely
# aren't ready yet, scope the exception to that specific step with a comment
# explaining why, rather than blanket-suppressing everything.

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # sharing-hub intentionally excluded: it is an empty scaffold with no
        # package.json yet — add it back when the app exists.
        service: [web-app, api-core]
    steps:
      - uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node so `cache: 'pnpm'` works.
      # Version comes from the packageManager field in package.json; pinning
      # it here too would conflict with that field (ERR_PNPM_BAD_PM_VERSION).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm --filter=${{ matrix.service }} install

      - name: Run ESLint
        run: pnpm --filter=${{ matrix.service }} run lint
        # Prettier check intentionally not gated here: no prettier config or
        # formatting normalization has landed yet — add it as its own step
        # once `prettier --write` has been applied repo-wide.

  test-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # sharing-hub excluded (no package.json); ai-generator is Python and
        # is covered by the test-python job below.
        service: [api-core, web-app, '@elmahrosa/sentinel']
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm --filter=${{ matrix.service }} install

      - name: Run tests
        run: pnpm --filter=${{ matrix.service }} run test

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/ai-generator/requirements.txt

      - name: Install dependencies
        run: pip install -r services/ai-generator/requirements.txt

      - name: Run tests
        run: python -m pytest services/ai-generator

  # Every service image that CD ships must be provably buildable in CI before
  # a merge. This matches the exact contexts cd.yml uses so a Dockerfile that
  # breaks cannot be merged silently and only fail on the deploy job.
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api-core
            dockerfile: services/api-core/Dockerfile
          - service: ai-generator
            dockerfile: services/ai-generator/Dockerfile
          - service: web-app
            dockerfile: apps/web-app/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # All service Dockerfiles build from the repo root so pnpm can install
      # from the committed pnpm-lock.yaml (--frozen-lockfile). This matches the
      # exact contexts cd.yml uses, so a Dockerfile that breaks cannot be
      # merged silently and only fail on the deploy job. Placeholder
      # NEXT_PUBLIC_* values prove the web-app ARG/ENV wiring works (the real
      # values never exist in CI); cd.yml passes the live ones.
      - name: Build ${{ matrix.service }} image
        env:
          BUILD_ARGS: ${{ matrix.service == 'web-app' && '--build-arg NEXT_PUBLIC_API_URL=https://example.invalid --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_ci_placeholder --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_ci_placeholder' || '' }}
        run: docker build ${{ env.BUILD_ARGS }} -f "${{ matrix.dockerfile }}" -t elmahrosa-${{ matrix.service }}:ci .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Run Snyk security scan
        # Scoped exception: no SNYK_TOKEN secret is configured in this repo
        # yet, so this step cannot pass. It is allowed to fail without
        # blocking; remove continue-on-error once the token is wired up.
        continue-on-error: true
        uses: snyk/actions@master
        with:
          command: test
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # pnpm audit reads the workspace-wide pnpm-lock.yaml, so one call at the
      # root covers every package (per-directory `npm audit` cannot work here:
      # npm workspaces are intentionally not used and no per-dir lockfiles
      # exist).
      - name: Run pnpm audit
        run: pnpm audit --audit-level=high

  dependabot:
    # dependency-review-action only works in a pull_request/pull_request_target
    # context; it errors on push events with "'base-ref'/'head-ref' required".
    # Restrict to PRs so a clean push to master cannot fail this job.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        with:
          fail-on-severity: moderate
          allow-ghsas: true
