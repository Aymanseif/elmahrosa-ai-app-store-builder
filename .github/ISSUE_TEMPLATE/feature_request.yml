name: Feature Request
description: Suggest an idea for this project
title: "[FEATURE] <description>"
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature!
  - type: input
    id: version
    attributes:
      label: Related Version
      description: Is your feature request related to a problem with a specific version?
      placeholder: "e.g., 1.0.0"
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the system would this feature affect?
      options:
        - Web App (Next.js)
        - API Core (Node.js/Express)
        - AI Generator (Python/FastAPI)
        - Build Engine (Gradle/Fastlane)
        - Documentation
        - Other
      multiple: false
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: "A clear and concise description of what the problem is."
      render: markdown
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: A clear and concise description of any alternative solutions or features you've considered.
      render: markdown
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request here.
      render: markdown
