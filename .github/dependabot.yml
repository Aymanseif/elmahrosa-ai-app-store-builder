version: 2
updates:
  # npm at the root only covers the (dep-less) root manifest — Dependabot does
  # not traverse pnpm workspaces, so each package with dependencies is listed.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    reviewers:
      - "elmahrosa-maintainers"
  - package-ecosystem: "npm"
    directory: "/apps/web-app"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    reviewers:
      - "elmahrosa-maintainers"
  - package-ecosystem: "npm"
    directory: "/services/api-core"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    reviewers:
      - "elmahrosa-maintainers"
  - package-ecosystem: "npm"
    directory: "/packages/sentinel"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    reviewers:
      - "elmahrosa-maintainers"
  - package-ecosystem: "npm"
    directory: "/packages/types"
    schedule:
      interval: "daily"
